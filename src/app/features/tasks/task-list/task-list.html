<div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 mt-4">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-gray-800">Listado de Tareas</h2>
    <button routerLink="/nueva-tarea" class="bg-blue-600 text-white px-4 py-2 rounded-md hover:bg-blue-700 transition font-medium">
      + Nueva Tarea
    </button>
  </div>

  <div class="overflow-x-auto">
    <table class="min-w-full table-auto text-left">
      <thead class="bg-gray-50 border-b border-gray-200">
        <tr>
          <th class="px-4 py-3 text-sm font-semibold text-gray-600">Título</th>
          <th class="px-4 py-3 text-sm font-semibold text-gray-600">Responsable</th>
          <th class="px-4 py-3 text-sm font-semibold text-gray-600">Prioridad</th>
          <th class="px-4 py-3 text-sm font-semibold text-gray-600">Estado</th>
          <th class="px-4 py-3 text-sm font-semibold text-gray-600">Fecha Límite</th>
        </tr>
      </thead>
      
      <tbody class="divide-y divide-gray-100" *ngIf="tasks$ | async as tasks; else loading">
    
    <tr *ngFor="let task of tasks" 
        class="transition"
        [ngClass]="isOverdue(task) ? 'bg-red-50 border-l-4 border-red-500 hover:bg-red-100' : 'hover:bg-gray-50'">
      
      <td class="px-4 py-3 text-gray-800 font-medium">{{ task.title }}</td>
      <td class="px-4 py-3 text-gray-600">{{ task.assignee }}</td>
      <td class="px-4 py-3">
        <span class="px-2 py-1 text-xs rounded-full bg-yellow-100 text-yellow-800 font-medium">
          {{ task.priority }}
        </span>
      </td>
      <td class="px-4 py-3">
        <span class="px-2 py-1 text-xs rounded-full bg-blue-100 text-blue-800 font-medium">
          {{ task.status }}
        </span>
      </td>
      
      <td class="px-4 py-3 text-sm">
        <div class="flex items-center gap-2">
          <span [ngClass]="isOverdue(task) ? 'text-red-700 font-bold' : 'text-gray-500'">
            {{ task.dueDate }}
          </span>
          <span *ngIf="isOverdue(task)" class="px-2 py-0.5 text-[10px] uppercase font-bold bg-red-200 text-red-800 rounded-full animate-pulse">
            Vencida
          </span>
        </div>
      </td>
    </tr>
  </tbody>
    </table>
  </div>

  <ng-template #loading>
    <div class="flex justify-center items-center py-12">
      <span class="text-gray-500 font-medium animate-pulse">Cargando tareas de la base de datos...</span>
    </div>
  </ng-template>
</div>
